name: Build Windows Admin MSIX

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      # pdfx/pdfium يستخدم cmake_minimum_required قديم أزالته CMake 4.x.
      # هذا المتغيّر يخبر CMake تقبل الحد الأدنى القديم بدل الفشل.
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # --obfuscate يشفّر أسماء الرموز في الكود المترجم لصعوبة الهندسة العكسية
      - name: Build Windows
        run: flutter build windows --release --target lib/main_admin.dart --obfuscate --split-debug-info=build/symbols

      # --build-windows false يمنع msix من إعادة البناء بالـ target الافتراضي
      # (main.dart = تطبيق الطالب). نغلّف نسخة الأدمن المبنية بالخطوة السابقة.
      - name: Create MSIX
        run: dart run msix:create --build-windows false

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: alkamal-admin-msix
          path: build\windows\x64\runner\Release\alkamal_app.msix
          retention-days: 30
